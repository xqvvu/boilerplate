packages:
  - apps/*
  - packages/*

allowBuilds:
  "@astryxdesign/cli": true
  "@astryxdesign/core": true
  esbuild: true
  lightningcss: true

catalog:
  vite-plus: 1.0.0
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  tsx: ^4.23.15
  typescript: ^7.0.2
  zod: ^4.6.5
  "@types/node": ^26.6.3
  "@t3-oss/env-core": ^0.13.11
  vitest: 5.0.1
  "@vitest/coverage-v8": 5.0.1
  "@vitest/ui": 5.0.1
  "@elysia/node": ^1.4.6
  "@sinclair/typebox": ^0.34.52
  elysia: ^1.4.30
  openapi-types: ^12.1.3

catalogs:
  orpc:
    "@orpc/client": 2.0.0-beta.40
    "@orpc/contract": 2.0.0-beta.40
    "@orpc/server": 2.0.0-beta.40
    "@orpc/openapi": 2.0.0-beta.40
    "@orpc/zod": 2.0.0-beta.40
    "@orpc/tanstack-query": 2.0.0-beta.40

  react:
    react: ^19.3.0
    react-dom: ^19.3.0
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
    "@vitejs/plugin-react": ^6.1.1

  tanstack:
    "@tanstack/react-devtools": ^0.10.13
    "@tanstack/react-router": ^1.170.41
    "@tanstack/react-router-devtools": ^1.167.2
    "@tanstack/devtools-vite": ^0.8.5
    "@tanstack/router-cli": ^1.167.40
    "@tanstack/router-plugin": ^1.168.42
    "@tanstack/eslint-plugin-query": ^5.104.0
    "@tanstack/react-query": ^5.104.0

  astryx:
    "@astryxdesign/core": 0.5.4
    "@astryxdesign/theme-neutral": 0.5.4
    "@astryxdesign/cli": 0.5.4
    "@stylexjs/stylex": ^0.19.1
    "@stylexjs/eslint-plugin": ^0.19.1
    "@stylexjs/unplugin": ^0.19.1

catalogMode: prefer

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

minimumReleaseAgeStrict: false
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeIgnoreMissingTime: true
