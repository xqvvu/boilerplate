packages:
  - apps/*
  - packages/*

allowBuilds:
  "@astryxdesign/cli": true
  "@astryxdesign/core": true
  esbuild: true
  lightningcss: true

catalog:
  vite-plus: 0.3.1
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  tsx: ^4.23.13
  typescript: ^7.0.2
  zod: ^4.6.2
  "@types/node": ^26.5.1
  "@t3-oss/env-core": ^0.13.11

catalogs:
  orpc:
    "@orpc/client": 2.0.0-beta.35
    "@orpc/contract": 2.0.0-beta.35
    "@orpc/server": 2.0.0-beta.35
    "@orpc/openapi": 2.0.0-beta.35
    "@orpc/zod": 2.0.0-beta.35
    "@orpc/tanstack-query": 2.0.0-beta.35

  test:
    "@vitest/coverage-v8": 4.1.11
    "@vitest/ui": 4.1.11

  react:
    react: ^19.3.0
    react-dom: ^19.3.0
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
    "@vitejs/plugin-react": ^6.1.1

  tanstack:
    "@tanstack/react-devtools": ^0.10.12
    "@tanstack/react-router": ^1.170.35
    "@tanstack/react-router-devtools": ^1.167.1
    "@tanstack/devtools-vite": ^0.8.5
    "@tanstack/router-cli": ^1.167.35
    "@tanstack/router-plugin": ^1.168.37
    "@tanstack/eslint-plugin-query": ^5.102.8
    "@tanstack/react-query": ^5.102.8

  astryx:
    "@astryxdesign/core": 0.5.4
    "@astryxdesign/theme-neutral": 0.5.4
    "@astryxdesign/cli": 0.5.4
    "@stylexjs/stylex": ^0.19.0
    "@stylexjs/eslint-plugin": ^0.19.0
    "@stylexjs/unplugin": ^0.19.0

catalogMode: prefer

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

minimumReleaseAgeStrict: false
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeIgnoreMissingTime: true
