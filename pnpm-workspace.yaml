packages:
  - apps/*
  - packages/*

allowBuilds:
  "@astryxdesign/cli": true
  "@astryxdesign/core": true
  esbuild: true
  lightningcss: true

catalog:
  vite-plus: 1.4.0
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  tsx: ^4.23.15
  typescript: ^7.0.2
  zod: ^4.6.7
  "@types/node": ^26.6.5
  "@t3-oss/env-core": ^0.13.11
  vitest: 5.0.5
  "@vitest/coverage-v8": 5.0.5
  "@vitest/ui": 5.0.5
  "@elysia/node": ^1.4.6
  "@sinclair/typebox": ^0.34.52
  elysia: ^1.4.30
  openapi-types: ^12.1.3

catalogs:
  orpc:
    "@orpc/client": 2.0.0-beta.45
    "@orpc/contract": 2.0.0-beta.45
    "@orpc/server": 2.0.0-beta.45
    "@orpc/openapi": 2.0.0-beta.45
    "@orpc/zod": 2.0.0-beta.45
    "@orpc/tanstack-query": 2.0.0-beta.45

  react:
    react: ^19.3.1
    react-dom: ^19.3.1
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
    "@vitejs/plugin-react": ^6.1.2

  tanstack:
    "@tanstack/react-devtools": ^0.10.13
    "@tanstack/react-router": ^1.170.45
    "@tanstack/react-router-devtools": ^1.167.2
    "@tanstack/devtools-vite": ^0.8.5
    "@tanstack/router-cli": ^1.167.45
    "@tanstack/router-plugin": ^1.168.47
    "@tanstack/eslint-plugin-query": ^5.104.5
    "@tanstack/react-query": ^5.104.5

  astryx:
    "@astryxdesign/core": 0.5.4
    "@astryxdesign/theme-neutral": 0.5.4
    "@astryxdesign/cli": 0.5.4
    "@stylexjs/stylex": ^0.19.1
    "@stylexjs/eslint-plugin": ^0.19.1
    "@stylexjs/unplugin": ^0.19.1

catalogMode: prefer

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

minimumReleaseAgeStrict: false
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeIgnoreMissingTime: true
minimumReleaseAgeExclude:
  - "@orpc/client@2.0.0-beta.45"
  - "@orpc/contract@2.0.0-beta.45"
  - "@orpc/json-schema@2.0.0-beta.45"
  - "@orpc/openapi@2.0.0-beta.45"
  - "@orpc/server@2.0.0-beta.45"
  - "@orpc/shared@2.0.0-beta.45"
  - "@orpc/tanstack-query@2.0.0-beta.45"
  - "@orpc/zod@2.0.0-beta.45"
  - "@voidzero-dev/vite-plus-core@1.4.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.4.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.4.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.4.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.4.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.4.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.4.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.4.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.4.0"
  - vite-plus@1.4.0
