packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  lightningcss: true

catalog:
  "@types/node": ^26.4.1
  vite-plus: 0.3.0
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  typescript: ^7.0.2
  zod: ^4.5.4
  "@stylexjs/stylex": ^0.19.0
  "@stylexjs/eslint-plugin": ^0.19.0
  "@stylexjs/unplugin": ^0.19.0
  "@hono/node-server": ^2.1.1
  hono: ^4.13.7
  tsx: ^4.23.13

catalogs:
  test:
    "@vitest/coverage-v8": 4.1.11
    "@vitest/ui": 4.1.11

  react:
    react: ^19.2.8
    react-dom: ^19.2.8
    "@types/react": ^19.2.18
    "@types/react-dom": ^19.2.7
    "@vitejs/plugin-react": ^6.1.1

  tanstack:
    "@tanstack/react-devtools": ^0.10.12
    "@tanstack/react-router": ^1.170.33
    "@tanstack/react-router-devtools": ^1.167.1
    "@tanstack/devtools-vite": ^0.8.5
    "@tanstack/router-cli": ^1.167.34
    "@tanstack/router-plugin": ^1.168.36

catalogMode: prefer

overrides:
  vite@*: "catalog:"
  vitest: 4.1.11

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
